name: ✨ 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出建议！请尽量描述清楚这个功能的价值和使用场景。

  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 清晰描述你遇到的需求或痛点。
      placeholder: 当我...时，我希望...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望看到的功能或实现方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 有没有其他可行的思路？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 其他任何相关背景或截图（注意脱敏）。
    validations:
      required: false
